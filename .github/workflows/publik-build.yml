name: "publik build: Astro agent with Sign in with publik"

# Checks and builds the Astro agent extension that carries the publik module
# (Sign in with publik + usage counts, apps/app/lib/publik/publik.ts), WITHOUT
# a release and WITHOUT the app token: the artifact is for a look and for
# tests, not for a user. A release build bakes VITE_PUBLIK_APP_TOKEN in
# (RELEASING.md §2) and packs the CRX with the signing key (§3).
#
#   extension   typecheck, the unit tests (the module's gate against a fake
#               publik among them), the WXT build, and a check that the built
#               files hold the module

on:
  push:
    branches:
      - "signin-gate"
      - "publik/**"
      - "telemetry/**"
    paths:
      - ".github/workflows/publik-build.yml"
      - "packages/browseros-agent/apps/app/**"
      - "packages/browseros-agent/packages/**"
      - "packages/browseros-agent/package.json"
      - "packages/browseros-agent/bun.lock"
  workflow_dispatch:

concurrency:
  group: publik-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extension:
    name: Agent extension (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/browseros-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun ci

      - name: Create dev env file
        # No app token here: the gate would say "This build has no publik app
        # token" at runtime. The build and the tests do not need one.
        run: cp .env.development.example .env.development

      - name: Typecheck
        run: cd apps/app && bun run typecheck

      - name: Unit tests
        run: cd apps/app && bun run test

      - name: Build the extension
        run: bun run build:agent

      - name: The publik module is in the built extension
        run: |
          set -euo pipefail
          OUT=apps/app/dist/chrome-mv3
          test -f "$OUT/manifest.json"
          for word in '/api/v1/installs' '/api/v1/telemetry' 'app_opened' 'active_session' 'Sign in with publik' 'publik self-test:'; do
            grep -rlq -- "$word" "$OUT" || { echo "FAIL: '$word' not in $OUT"; exit 1; }
          done
          echo "PASS: the publik module is in the built extension, manifest $(grep -o '"version": *"[^"]*"' "$OUT/manifest.json")"

      - name: Upload the built extension (unsigned, no app token)
        uses: actions/upload-artifact@v4
        with:
          name: astro-agent-chrome-mv3-no-token
          path: packages/browseros-agent/apps/app/dist/chrome-mv3
          if-no-files-found: error
          retention-days: 14
