<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Astro">
  <title>Astro</title>
  <defs>
    <linearGradient id="astroTwinkle" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="0.5" stop-color="#facc15"/>
      <stop offset="1" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="astroTwinkleSm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef08a"/>
      <stop offset="1" stop-color="#facc15"/>
    </linearGradient>
  </defs>

  <!-- Four-point twinkle. The sides are concave so the arms stay sharp when the
       mark is scaled down to a 16px favicon; a convex star turns into a blob. -->
  <path fill="url(#astroTwinkle)"
        d="M62 6
           C66 42 86 62 122 66
           C86 70 66 90 62 126
           C58 90 38 70 2 66
           C38 62 58 42 62 6 Z"
        transform="translate(2 -2)"/>

  <!-- Smaller companion sparkle, upper right — the detail that makes it read as
       a twinkle rather than a single star. -->
  <path fill="url(#astroTwinkleSm)"
        d="M103 12
           C104.6 26 111 32.4 125 34
           C111 35.6 104.6 42 103 56
           C101.4 42 95 35.6 81 34
           C95 32.4 101.4 26 103 12 Z"
        transform="translate(-4 4) scale(0.78) translate(24 6)"/>
</svg>
